[workspace]
resolver = "2"
members = [
    ".",
    "crates/argus-core",
    "crates/argus-devpilot",
    "crates/argus-netscope",
    "crates/argus-infrastructure",
    "crates/argus-tui",
    "crates/argus-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Projeto ARGUS Contributors"]
repository = "https://github.com/micaelbarros/Projeto-Argus"
description = "Projeto ARGUS — Local-first developer productivity and network observability CLI + TUI in Rust."

[workspace.dependencies]
# Internal crates
argus-core = { path = "crates/argus-core" }
argus-devpilot = { path = "crates/argus-devpilot" }
argus-netscope = { path = "crates/argus-netscope" }
argus-infrastructure = { path = "crates/argus-infrastructure" }
argus-tui = { path = "crates/argus-tui" }

# CLI & TUI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
color-eyre = "0.6"

# Async & Parallelism
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
tokio-util = "0.7"
rayon = "1.10"

# Filesystem & Serialization
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "6.0"
chrono = { version = "0.4", features = ["serde"] }

# Git & Analysis
git2 = { version = "0.20", default-features = false }
regex = "1.11"

# Network & System
sysinfo = "0.33"
netstat2 = "0.11"

# Persistence & Observability
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"

# Testing & Benchmarking
proptest = "1.6"
tempfile = "3.15"
criterion = "0.5"
assert_cmd = "2.0"
predicates = "3.1"

[package]
name = "argus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
autotests = false

[dependencies]
argus-core.workspace = true
argus-devpilot.workspace = true
argus-netscope.workspace = true
argus-infrastructure.workspace = true
argus-tui.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
criterion.workspace = true
tokio.workspace = true
serde_json.workspace = true
git2.workspace = true
chrono.workspace = true
tokio-util.workspace = true

[[test]]
name = "devpilot_tests"
path = "tests/devpilot_tests.rs"

[[test]]
name = "netscope_tests"
path = "tests/netscope_tests.rs"

[[bench]]
name = "scanner_benchmark"
harness = false
